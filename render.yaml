services:
  - type: web
    name: unidoue
    runtime: node
    plan: starter          # doimiy disk (hisoblar saqlanishi) uchun pullik reja kerak (~$7/oy)
    buildCommand: "echo no build"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /data
      - key: ADMIN_TOKEN
        generateValue: true
      # Mentor soʻrovlari Telegramga kelishi uchun (ixtiyoriy):
      # - key: TG_BOT_TOKEN
      #   sync: false
      # - key: TG_CHAT_ID
      #   sync: false
    disk:
      name: unidoue-data
      mountPath: /data
      sizeGB: 1
