services:
  - type: web
    name: unidoue
    runtime: node
    plan: free             # BEPUL: sinov uchun. Server qayta ishga tushganda hisoblar oʻchadi (doimiy disk yoʻq).
    buildCommand: "echo no build"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_TOKEN
        generateValue: true
